- insert:
    - id: dsh-s2s
      name: 'dsh-s2s'
      config:
        hub: {}                     # in-process hub service, no listening socket
        mesh:
          project: main
          persistConnections: true
          autoConnect: false
        lifecycle:
          autoResume: allow          # wake dormant sessions on s2s_resume (name/title addressing)
        budget:
          maxHops: 6
          ratePerMinute: 10
