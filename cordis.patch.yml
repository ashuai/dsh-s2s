- insert:
    - id: dsh-s2s
      name: 'dsh-s2s'
      config:
        hub: {}                     # in-process hub service, no listening socket
        mesh:
          project: main
          persistConnections: true
        lifecycle:
          autoResume: deny          # conservative default; flip to allow to auto-wake
        budget:
          maxHops: 6
          ratePerMinute: 10
